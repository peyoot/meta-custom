##############################################################################
# hostapd_wlan1.conf - Wi-Fi 6 (802.11ax) optimized template, channel 165
#
# Tailored specifically to what the Murata Type 2FY module (Infineon
# CYW55513) can actually deliver, per its own datasheet's "Key Feature"
# list: "1x1 SISO with 20MHz channels". That single fact rules out most of
# the throughput-boosting side of Wi-Fi 6 on this hardware:
#
#   NOT applicable on this chip (omitted below on purpose - setting these
#   would do nothing, or could even cause hostapd to reject the config):
#     - 40/80/160MHz channel bonding (chip is 20MHz-only; channel 165 also
#       has no valid 40MHz pairing in most regulatory domains - it's the
#       lone top channel in U-NII-3, e.g. 5735-5835 MHz = 149/153/157/161/165,
#       an odd count, so 165 is left unpaired)
#     - SU/MU beamforming (needs >=2 TX antennas; this is 1x1 SISO)
#     - MU-MIMO (same reason)
#
#   Genuinely applicable and worth configuring on this chip:
#     - OFDMA (automatic once ieee80211ax=1 + he_* params below are set;
#       benefit scales with number of simultaneously-active clients)
#     - BSS Coloring (helps in dense/overlapping-BSS environments)
#     - TWT (client-side power saving, useful if your clients are
#       battery/IoT devices that support it)
#     - HE modulation up to MCS11 (1024-QAM) - meaningfully faster than
#       802.11ac's MCS9 (256-QAM) ceiling at the SAME 20MHz bandwidth, given
#       good enough SNR for the AP and client to negotiate the higher MCS
#
# Review reminder: this is a draft config, not validated on your actual
# hardware/hostapd build - confirm your hostapd version actually recognizes
# every he_* key below (grep hostapd's own sample hostapd.conf / run
# `hostapd -v` and check the build's CONFIG_IEEE80211AX support) before
# using this in a shipping image, and get a responsible engineer to review
# it per your internal AI-use policy.
#
# Validation note: an earlier draft of this file included ht_capab=[LDPC]
# and vht_capab=[RXLDPC], assumed "safe to advertise even if unused" -
# real-hardware testing (`hostapd -dd /etc/hostapd_wlan1.conf`) proved that
# assumption wrong for this driver:
#   Driver does not support configured HT capability [LDPC]
#   wlan1: interface state COUNTRY_UPDATE->DISABLED
# hostapd checks every ht_capab/vht_capab flag against what the driver
# actually advertises at startup and refuses to bring the interface up at
# all if even one flag isn't supported - it does NOT silently drop the
# unsupported flag and continue with the rest. Both LDPC flags have been
# removed from this file as a result (see the ht_capab/vht_capab lines
# below for the corrected set). If you add any capability flag back in
# that isn't already in this validated set, re-run `hostapd -dd` and check
# for this same class of rejection before assuming it's harmless.
#
# Confirmed on real hardware after the LDPC fix: hostapd now reaches
# "wlan1: AP-ENABLED" successfully with this config. One further
# non-fatal issue surfaced in that same run: the EDCA/WMM tuning section
# further down gets rejected by the driver (res=-95/EOPNOTSUPP) for all
# four access categories - doesn't block the AP from starting, but those
# values aren't actually being applied; see that section's own comments.
##############################################################################

ctrl_interface=/var/run/hostapd
ctrl_interface_group=0
interface=wlan1
driver=nl80211

##############################################################################
# Identity / security - unchanged from your existing config, adjust as needed
##############################################################################
ssid=digi-wlan1-372e
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
wpa_pairwise=CCMP
wpa_passphrase=digiconnectcore

# WPA3-Personal (SAE) transition mode - optional but recommended if your
# client devices support it: lets WPA3-capable clients use SAE (more
# resistant to offline dictionary attacks) while WPA2-only clients still
# connect normally via PSK. Uncomment if you want this; leave commented if
# you need to guarantee compatibility with older/simpler client stacks that
# might mishandle a mixed WPA2/WPA3 AKM list.
# Confirmed CONFIG_SAE=y in this BSP's hostapd build-time config, so this
# should actually work if enabled (unlike the WMM/EDCA section further
# down, or CONFIG_MBO/CONFIG_IEEE80211R/CONFIG_WNM which are NOT compiled
# into this specific hostapd binary - see README for the full build-config
# review).
#wpa_key_mgmt=WPA-PSK SAE
#ieee80211w=1
#sae_password=digiconnectcore

##############################################################################
# PHY mode and channel
##############################################################################
hw_mode=a
channel=165
# 20MHz only - see the header comment. Setting vht_oper_chwidth/
# he_oper_chwidth to anything other than 0 (20MHz) on this chip either gets
# silently ignored or negotiated back down to 20MHz by the client, so leave
# these at 0 rather than configuring for a width the hardware can't do.

ieee80211n=1
ieee80211ac=1
ieee80211ax=1

# Required for 802.11n/ac/ax to actually negotiate their higher-throughput
# features (A-MPDU aggregation, OFDMA, etc.) - without this, clients may
# silently fall back to legacy 802.11a rates only.
wmm_enabled=1

##############################################################################
# 802.11n (HT) capabilities - 20MHz only, no 40MHz (see header)
##############################################################################
ht_capab=[SHORT-GI-20][RXSTBC1]
# SHORT-GI-20 : shorter guard interval on 20MHz -> small throughput gain,
#               costs nothing if the client doesn't support it (falls back).
# RXSTBC1     : this chip is 1x1 so it can't transmit STBC (needs >=2 TX
#               chains), but it CAN receive/decode an STBC stream from a
#               2-antenna client if that client chooses to send one -
#               harmless to advertise, costs nothing on a 1x1 radio.
# Deliberately NOT set: HT40+/HT40- (no 40MHz), TX-STBC, beamforming flags
# (all need >=2 TX antennas this chip doesn't have).
#
# [LDPC] was here in an earlier draft and REMOVED after real-hardware
# testing (`hostapd -dd`) rejected it outright:
#   Driver does not support configured HT capability [LDPC]
#   wlan1: interface state COUNTRY_UPDATE->DISABLED
# hostapd checks every ht_capab flag against what the driver actually
# advertises at startup and refuses to bring the interface up at all if
# even one flag isn't supported - it doesn't silently drop the
# unsupported flag and continue. So this wasn't a "safe to leave in,
# costs nothing" flag as assumed - confirmed the opposite on this
# specific driver. VHT's [RXLDPC] below was removed for the same reason,
# proactively, since it's the same underlying LDPC decode capability on
# the same silicon - re-add either only if you've independently confirmed
# this driver actually advertises LDPC support.

##############################################################################
# 802.11ac (VHT) capabilities - 20MHz only
##############################################################################
vht_oper_chwidth=0
vht_oper_centr_freq_seg0_idx=165
vht_capab=[SHORT-GI-80]
# vht_capab flags here matter less than usual since we're pinned to 20MHz
# (most of the interesting VHT capability flags are about 80/160MHz
# operation), but SHORT-GI-80 costs nothing to advertise and helps if a
# client happens to still use it at 20MHz.
# Deliberately NOT set: SU/MU beamformer flags (no TX antennas to spare),
# RXLDPC (removed - see the ht_capab comment above; the HT [LDPC] flag
# was confirmed rejected by this driver on real hardware, and VHT LDPC
# decode is the same underlying silicon capability, so it's removed here
# too rather than waiting to hit the same failure a second time).

##############################################################################
# 802.11ax (HE) capabilities - the actual Wi-Fi 6 gains available on this chip
##############################################################################
he_oper_chwidth=0
he_oper_centr_freq_seg0_idx=165

# BSS Coloring: helps clients/APs distinguish your BSS from an overlapping
# one on the same/adjacent channel, reducing unnecessary CCA deference.
# Pick any value 1-63 that's unlikely to collide with a neighboring AP's
# color if you know it; if you don't know neighbors' colors, any fixed
# value here is still better than none (0 is reserved/disabled).
he_bss_color=19

# Target Wake Time: lets supporting clients negotiate sleep schedules with
# the AP for power saving. Only helps if your client devices actually
# implement TWT (many battery/IoT Wi-Fi 6 client chipsets do; check yours).
# Setting this to 1 does not break clients that don't support TWT - they
# simply don't use it.
he_twt_required=0
# ^ 0 = TWT offered but optional (recommended default: don't force it,
#   some client stacks handle "required" poorly). Set to 1 only if you
#   specifically need to mandate TWT for all associating clients.

# HE MCS support - advertise the full MCS0-11 range (1024-QAM at MCS10/11)
# so capable clients can negotiate the higher rates when SNR allows. This
# is the main real throughput win available on this 1x1/20MHz chip versus
# 802.11ac, since the wider-bandwidth/MIMO wins aren't available here.
he_su_beamformee=0
# ^ Deliberately 0 (disabled), not just omitted: enabling beamformee
# support advertises that the AP can be steered TO by a beamforming-capable
# client, but with only one antenna there's no meaningful gain to receiving
# a beamformed stream either, and leaving it off avoids clients wasting
# airtime on sounding frames that won't help.

# Reasonable default operational tuning (not chip-specific, but worth
# having explicit rather than relying on hostapd's built-in defaults):
he_default_pe_duration=4
he_rts_threshold=1023
# he_rts_threshold: use HE-specific RTS/CTS protection above this frame
# size (in the OFDMA/MU context) - the default of 1023 is a reasonable,
# widely-used starting point; only tune this down if you have a specific
# hidden-node problem, since more RTS/CTS overhead reduces throughput.

##############################################################################
# EDCA / WMM tuning for latency-sensitive traffic (VoIP, video calls, etc.)
#
# CONFIRMED NON-FUNCTIONAL ON THIS DRIVER as of real-hardware testing
# (`hostapd -dd`): every one of these gets rejected at AP start with
#   nl80211: TX queue param set: queue=N ... --> res=-95
#   Failed to set TX queue parameters for queue N.
# (res=-95 is EOPNOTSUPP). This is non-fatal - hostapd logs the failure
# and continues, the AP still starts and runs fine - but these values are
# NOT actually taking effect on this driver; the AP falls back to
# whatever EDCA parameters the driver/firmware uses internally by
# default. Left in place below purely for documentation (in case a future
# firmware/driver update adds support for this), not because it currently
# does anything. Don't rely on this section for real latency tuning on
# this hardware until re-confirmed working.
##############################################################################
wmm_ac_bk_cwmin=4
wmm_ac_bk_cwmax=10
wmm_ac_bk_aifs=7
wmm_ac_bk_txop_limit=0
wmm_ac_bk_acm=0

wmm_ac_be_aifs=3
wmm_ac_be_cwmin=4
wmm_ac_be_cwmax=10
wmm_ac_be_txop_limit=0
wmm_ac_be_acm=0

wmm_ac_vi_aifs=2
wmm_ac_vi_cwmin=3
wmm_ac_vi_cwmax=4
wmm_ac_vi_txop_limit=94
wmm_ac_vi_acm=0

wmm_ac_vo_aifs=2
wmm_ac_vo_cwmin=2
wmm_ac_vo_cwmax=3
wmm_ac_vo_txop_limit=47
wmm_ac_vo_acm=0

##############################################################################
# Region/Country - unchanged from your existing config
##############################################################################
ieee80211d=1
ieee80211h=1
country_code=US

##############################################################################
# Optional: 802.11k/v/r for better roaming behavior, if you have (or plan
# to have) more than one AP and want clients to roam between them cleanly.
# Not related to Wi-Fi 6 specifically, but commonly paired with it in
# multi-AP deployments. Leave commented out for a single-AP setup.
#
# Build-config check on this BSP's hostapd (/etc default .config used to
# compile it): CONFIG_IEEE80211R (802.11r fast roaming) and CONFIG_WNM
# (802.11v, which wnm_sleep_mode below depends on) are BOTH commented out
# - not compiled into this specific hostapd binary. wnm_sleep_mode=1 below
# almost certainly won't do anything as a result. Whether
# rrm_neighbor_report/bss_transition are gated by the same CONFIG_WNM flag
# or compiled in unconditionally isn't confirmed either way - test
# directly if you need this. If you do want 802.11r/v for a real multi-AP
# deployment, the actual fix is asking Digi/Murata to flip
# CONFIG_IEEE80211R=y / CONFIG_WNM=y in the hostapd recipe and rebuild -
# note upstream hostapd's own comment on CONFIG_WNM: "This is experimental
# and not complete implementation", so weigh that against your stability
# requirements before requesting it.
##############################################################################
#rrm_neighbor_report=1
#wnm_sleep_mode=1
#bss_transition=1
