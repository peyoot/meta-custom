# 接口设置
interface=wlan1
driver=nl80211

# SSID 和基本设置
ssid=YourWiFi6AP
country_code=US

# 5GHz 频段，WiFi 6 模式
hw_mode=a
ieee80211ax=1  # 启用 WiFi 6
channel=0      # 启用 ACS（0 表示自动选择信道）

# ACS 设置
ieee80211d=1   # 启用国家代码
ieee80211h=1   # 启用 DFS（若使用 52-144 信道）

# 信道宽度（WiFi 6 支持 20/40/80/160 MHz）
vht_oper_chwidth=1  # 0=20/40MHz, 1=80MHz, 2=160MHz
vht_oper_centr_freq_seg0_idx=42  # 中心频率索引（示例，适用于信道 36-48）

# HE（WiFi 6）特定设置
he_oper_chwidth=1  # WiFi 6 信道宽度
he_oper_centr_freq_seg0_idx=42  # 与 VHT 一致
he_bss_color=1  # BSS 着色，减少干扰
he_mu_mimo=1    # 启用多用户 MIMO

# 安全设置（推荐 WPA3 或 WPA2/WPA3 混合）
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK WPA-PSK-SHA256 SAE
wpa_passphrase=YourPassword
wpa_pairwise=CCMP
rsn_pairwise=CCMP

# 优化性能
wmm_enabled=1
ht_capab=[HT40+][SHORT-GI-20][SHORT-GI-40]
vht_capab=[MAX-MPDU-11454][RXLDPC][SHORT-GI-80][TX-STBC][RX-STBC1][MAX-A-MPDU-LEN-EXP7]
he_capab=[HE40/HE80][HE-MCS-0-11][HE-MAC-CAP0][HE-PHY-CAP0]